name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - run: make check

  browser:
    # One journey in a real Chromium against the app in demo mode: no key, no model call.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make browser-test

  image:
    # Builds the API image and proves the two things a deployed build must do:
    # refuse to start in demo mode, and serve when fully configured.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f backend/Dockerfile -t ask-analytics-api .
      - name: A throwaway admin token for this job
        run: echo "TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: No secret file and no test tooling in the image
        run: |
          docker run --rm ask-analytics-api sh -c '
            test ! -e /srv/.env && test ! -e /srv/backend/.env &&
            ! python -c "import pytest" 2>/dev/null &&
            ! python -c "import mcp" 2>/dev/null &&
            test "$(id -u)" != 0'
      - name: Refuses to start in demo mode
        run: |
          if docker run --rm -e ADMIN_TOKEN="$TOKEN" ask-analytics-api > refusal.log 2>&1; then
            echo "The image started without ANTHROPIC_API_KEY" >&2; exit 1
          fi
          grep -q "Refusing to start a deployed build" refusal.log
          grep -q "demo mode is for local use only" refusal.log
      - name: Serves when fully configured
        run: |
          # A placeholder key: nothing in this job asks a question, so no model is called.
          docker run -d --name api -p 8000:8000 \
            -e ADMIN_TOKEN="$TOKEN" \
            -e ANTHROPIC_API_KEY=placeholder-not-a-real-key \
            ask-analytics-api
          for attempt in $(seq 1 30); do
            curl -sf localhost:8000/health > health.json && break
            sleep 1
          done
          docker logs api
          grep -q '"demo_mode":false' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/api/overview?window=7d')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'localhost:8000/api/overview?window=7d')" = 200

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .'
